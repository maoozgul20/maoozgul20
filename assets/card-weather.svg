<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="Advance Weather App">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#33E0C4"/>
      <stop offset="1" stop-color="#7C5CFF"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#33E0C4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#33E0C4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect x="2" y="2" width="596" height="276" rx="18"/></clipPath>
  </defs>
  <rect x="2" y="2" width="596" height="276" rx="18" fill="#0b0f1a"/>
  <g clip-path="url(#c)">
    <rect width="600" height="280" fill="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect y="0" width="160" height="280" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;900" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="2" y="2" width="596" height="276" rx="18" fill="none" stroke="url(#border)" stroke-width="3"/>
  <text x="30" y="62" font-size="34">🌤️<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.5s" repeatCount="indefinite"/></text>
  <text x="80" y="58" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Advance Weather App</text>
  <rect x="30" y="80" width="110" height="26" rx="13" fill="#3ddc84" fill-opacity="0.18" stroke="#3ddc84"/>
  <circle cx="46" cy="93" r="4" fill="#3ddc84"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="58" y="98" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#3ddc84">COMPLETED</text>
  <text x="30" y="142" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#b8c0e0">Live weather for any city with glassmorphism</text><text x="30" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#b8c0e0">UI, animated details and backgrounds that</text><text x="30" y="194" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#b8c0e0">change with the sky.</text>
  <rect x="30" y="222" width="108" height="30" rx="15" fill="#7C5CFF" fill-opacity="0.15" stroke="#7C5CFF" stroke-opacity="0.6"/><text x="84" y="242" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6e9ff">JavaScript</text><rect x="148.0" y="222" width="49" height="30" rx="15" fill="#7C5CFF" fill-opacity="0.15" stroke="#7C5CFF" stroke-opacity="0.6"/><text x="173" y="242" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6e9ff">CSS</text><rect x="207.2" y="222" width="142" height="30" rx="15" fill="#7C5CFF" fill-opacity="0.15" stroke="#7C5CFF" stroke-opacity="0.6"/><text x="278" y="242" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6e9ff">OpenWeatherMap</text>
</svg>

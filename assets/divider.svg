<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#33E0C4"/>
      <stop offset="0.7" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="0" y="5" width="1200" height="4" rx="2" fill="url(#g)" filter="url(#glow)" opacity="0.8"/>
  <rect x="0" y="6" width="1200" height="2" rx="1" fill="url(#g)"/>
  <circle cy="7" r="4" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="0;1200" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="7" r="2.5" fill="#ffffff">
    <animate attributeName="cx" values="0;1200" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
